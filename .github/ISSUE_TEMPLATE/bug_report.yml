name: Bug report
description: Something doesn't work or a number on the sheet is wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where
      options: [Windows (installer), Windows (portable), Linux AppImage, Linux deb/rpm, Browser (dev build)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. New character\n2. …"
  - type: textarea
    id: content
    attributes:
      label: Content loaded
      description: The 2024 index, Aurora Legacy, your own files… Please don't paste copyrighted book text.

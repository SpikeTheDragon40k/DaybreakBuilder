name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Integration tests run against the community content when available.
      - name: Fetch AuroraLegacy content for integration tests
        run: git clone --depth 1 https://github.com/AuroraLegacy/elements.git fixtures/external/aurora-legacy || true
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @daybreakbuilder/desktop

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build desktop app
        working-directory: apps/desktop
        run: npx tauri build
      # Installers count against Actions storage, so PRs only check that the build works.
      # Pushes to main and manual runs keep them for a few days; releases live on
      # GitHub Releases.
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: DaybreakBuilder-${{ runner.os }}
          retention-days: 3
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
      # The bare release binary embeds the UI, so it runs without installing anything
      # (Windows 10/11 ship the WebView2 runtime). Its name turns on portable mode.
      - name: Prepare portable Windows exe
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p portable
          cp apps/desktop/src-tauri/target/release/daybreakbuilder.exe "portable/DaybreakBuilder_${version}_x64_portable.exe"
          ls -l portable
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows' && github.event_name != 'pull_request'
        with:
          name: DaybreakBuilder-Windows-portable
          retention-days: 3
          path: portable/*.exe
          if-no-files-found: error

[package]
name = "dndbuilder"
version = "0.5.0"
description = "Open-source D&D 5e character builder compatible with Aurora Builder content"
authors = ["dndbuilder contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "dndbuilder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
